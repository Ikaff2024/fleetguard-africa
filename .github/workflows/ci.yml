name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Une nouvelle poussée annule la vérification en cours sur la même branche :
# inutile de payer des minutes de calcul pour un commit déjà remplacé.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Qualité (types, lint, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installation
        run: npm ci --no-audit --no-fund

      - name: Vérification des types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installation
        run: npm ci --no-audit --no-fund

      - name: Tests unitaires et d'intégration
        run: npm run test:coverage

      - name: Publication de la couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installation
        run: npm ci --no-audit --no-fund

      - name: Build web + serveur
        run: npm run build

      - name: Contrôle du poids de l'écran d'accueil
        # Garde-fou anti-régression : sur une 3G de corridor, chaque centaine de
        # kilo-octets ajoute plusieurs secondes avant le premier affichage.
        run: |
          BUDGET_KB=260
          TOTAL=0
          for f in dist/assets/index-*.js dist/assets/vendor-react-*.js dist/assets/vendor-map-*.js dist/assets/vendor-icons-*.js dist/assets/index-*.css; do
            [ -f "$f" ] || continue
            SIZE=$(gzip -c "$f" | wc -c)
            TOTAL=$((TOTAL + SIZE))
            echo "  $(basename "$f") : $((SIZE / 1024)) Ko gzip"
          done
          TOTAL_KB=$((TOTAL / 1024))
          echo "Total écran d'accueil : ${TOTAL_KB} Ko gzip (budget : ${BUDGET_KB} Ko)"
          if [ "$TOTAL_KB" -gt "$BUDGET_KB" ]; then
            echo "::error::Budget de poids dépassé : ${TOTAL_KB} Ko > ${BUDGET_KB} Ko"
            exit 1
          fi

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construction de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fleetguard-africa:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installation
        run: npm ci --no-audit --no-fund

      - name: Vulnérabilités élevées et critiques
        run: npm audit --audit-level=high
