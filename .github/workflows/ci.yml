name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Une nouvelle poussée annule la vérification en cours sur la même branche :
# inutile de payer des minutes de calcul pour un commit déjà remplacé.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Qualité (types, lint, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installation
        run: npm ci --no-audit --no-fund

      - name: Vérification des types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installation
        run: npm ci --no-audit --no-fund

      - name: Tests unitaires et d'intégration
        run: npm run test:coverage

      - name: Publication de la couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installation
        run: npm ci --no-audit --no-fund

      - name: Build web + serveur
        run: npm run build

      - name: Installation du navigateur de test
        run: npx playwright install --with-deps chromium

      - name: Contrôle de fumée (l'application se charge-t-elle vraiment ?)
        # Une page peut renvoyer un HTML valide et rester blanche parce qu'un
        # script échoue. C'est arrivé en production : toutes les ressources
        # répondaient 200, mais la politique CORS bloquait les fichiers de la
        # page. Seule l'exécution du JavaScript dans un navigateur le détecte.
        run: |
          # NODE_ENV=development : ce job ne dispose pas de base de données, et
          # la configuration refuse — a raison — de démarrer en production sans
          # DATABASE_URL ni JWT_SECRET. Le mode production authentifié est
          # couvert par le job « Isolation multi-tenant ».
          NODE_ENV=development PORT=3000 node dist/server.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/v1/health > /dev/null && break
            sleep 1
          done
          node scripts/smoke-test.mjs http://localhost:3000
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

      - name: Capture en cas d'échec
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-screenshot
          path: smoke-screenshot.png
          retention-days: 7

      - name: Contrôle du poids de l'écran d'accueil
        # Garde-fou anti-régression : sur une 3G de corridor, chaque centaine de
        # kilo-octets ajoute plusieurs secondes avant le premier affichage.
        run: |
          BUDGET_KB=260
          TOTAL=0
          for f in dist/assets/index-*.js dist/assets/vendor-react-*.js dist/assets/vendor-map-*.js dist/assets/vendor-icons-*.js dist/assets/index-*.css; do
            [ -f "$f" ] || continue
            SIZE=$(gzip -c "$f" | wc -c)
            TOTAL=$((TOTAL + SIZE))
            echo "  $(basename "$f") : $((SIZE / 1024)) Ko gzip"
          done
          TOTAL_KB=$((TOTAL / 1024))
          echo "Total écran d'accueil : ${TOTAL_KB} Ko gzip (budget : ${BUDGET_KB} Ko)"
          if [ "$TOTAL_KB" -gt "$BUDGET_KB" ]; then
            echo "::error::Budget de poids dépassé : ${TOTAL_KB} Ko > ${BUDGET_KB} Ko"
            exit 1
          fi

  isolation:
    name: Isolation multi-tenant (base réelle)
    runs-on: ubuntu-latest
    # Exigence du cahier des charges : « les tests démontrent qu'un tenant ne
    # peut pas lire les données d'un autre ». Ces tests s'exécutent contre une
    # vraie base PostGIS, avec le rôle applicatif soumis au Row-Level Security.
    # Les valider sur des données en mémoire ne prouverait que le filtrage
    # applicatif, pas la défense en profondeur.
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: fleetguard
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: fleetguard_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetguard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fleetguard:ci_only_password@localhost:5432/fleetguard_db?schema=public
      DATABASE_APP_URL: postgresql://fleetguard_app:ci_app_password@localhost:5432/fleetguard_db?schema=public
      APP_DB_PASSWORD: ci_app_password
      JWT_SECRET: integration-tests-secret-de-32-caracteres-minimum
      SEED_ON_START: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installation
        run: npm ci --no-audit --no-fund

      - name: Préparation de la base (extensions, migrations, RLS, comptes)
        run: |
          npm run build:server
          npm run build:seed
          node -e "
            import('./scripts/start-production.mjs').catch(e => { console.error(e); process.exit(1); });
          " &
          PREP_PID=$!
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/v1/health > /dev/null && break
            sleep 2
          done
          kill $PREP_PID 2>/dev/null || true

      - name: Contrôle SQL de l'isolation
        run: |
          PGPASSWORD=ci_only_password psql -h localhost -U fleetguard -d fleetguard_db \
            -v ON_ERROR_STOP=1 -f prisma/sql/999_verify_rls.sql

      - name: Tests d'isolation multi-tenant
        run: npx vitest run tests/tenant-isolation.test.ts

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construction de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fleetguard-africa:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installation
        run: npm ci --no-audit --no-fund

      - name: Vulnérabilités élevées et critiques
        run: npm audit --audit-level=high
